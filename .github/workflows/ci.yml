name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Testes, tipos, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7
      - name: Instala o Node do .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instala as dependências
        run: npm ci
      - name: Testes
        run: npm test
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tokens de cor
        run: npm run test:tokens
      - name: Build do SPA
        run: npm run build
