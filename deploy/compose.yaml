name: quest-fast

services:
  app:
    image: quest-fast:latest
    restart: unless-stopped
    # Cabe o app (~150 MB) mais uma imagem no limite sendo decodificada
    # (~400 MB; os uploads são processados um de cada vez). Acima disso o
    # kernel derruba só o app, que o restart sobe de novo, e não a VM: sem
    # swap no container, ele não fica relendo o disco.
    mem_limit: 640m
    memswap_limit: 640m
    env_file: app.env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      # Seguro só porque o app não publica porta: o único caminho até ele é o Caddy.
      TRUST_PROXY: "true"
    volumes:
      - /srv/quest-fast/dados:/dados

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?defina SITE_ADDRESS no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
